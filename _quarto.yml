project:
  type: book
  output-dir: docs
  resources:
    - exams/*.pdf
    - exams/*.docx

book:
  title: "Midterm Exam, Fall 2026: Questions Explained"
  subtitle: "AI Assisted Software Development"
  author: "Prof. Y. Rosenthal"
  search: true
  chapters:
    - index.qmd
    - the-exams.qmd
    - answers-all-versions.qmd
    - version-a-explained.qmd

format:
  html:
    theme: cosmo
    css: styles.css
    toc: true
    toc-depth: 2
    number-sections: false
    include-in-header:
      - text: |
          <meta name="robots" content="noindex, nofollow">
